
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-woocommerce-mcp
  labels:
    app: woocommerce-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woocommerce-mcp
  template:
    metadata:
      labels:
        app: woocommerce-mcp
    spec:
      containers:
        - name: woocommerce-mcp
          image: "{{ .Values.images.woocommerceMcp.repository }}:{{ .Values.images.woocommerceMcp.tag }}"
          imagePullPolicy: {{ .Values.images.woocommerceMcp.pullPolicy }}
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: WOOCOMMERCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: WOOCOMMERCE_URL
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: WOOCOMMERCE_CONSUMER_SECRET
          readinessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-woocommerce-mcp
spec:
  selector:
    app: woocommerce-mcp
  ports:
    - name: http
      port: 8003
      targetPort: 8003
  type: ClusterIP
